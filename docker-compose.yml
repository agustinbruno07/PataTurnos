services:
  db:
    image: postgres:16-alpine
    container_name: pataturnos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pataturnos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pataturnos_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pataturnos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pataturnos_data:
